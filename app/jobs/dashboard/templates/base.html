<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CareerOS Discovery Dashboard{% endblock %}</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-green: #4ade80;
            --accent-purple: #c084fc;
            --accent-orange: #fb923c;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        nav { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
        .logo { font-size: 20px; font-weight: 700; color: var(--accent); }
        .nav-links a { color: var(--text-muted); text-decoration: none; margin-left: 20px; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 18px; }
        .stat-value { font-size: 28px; font-weight: 700; margin-top: 6px; color: var(--text-main); }
        .stat-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; background: var(--bg-card); }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .badge-green { background: rgba(74, 222, 128, 0.15); color: var(--accent-green); }
        .badge-blue { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
        .badge-purple { background: rgba(192, 132, 252, 0.15); color: var(--accent-purple); }
        .badge-orange { background: rgba(251, 146, 60, 0.15); color: var(--accent-orange); }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        input, select { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 8px 12px; border-radius: 6px; font-size: 14px; }
        button { background: var(--accent); color: #0f172a; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div class="logo">CareerOS Discovery</div>
            <div class="nav-links">
                <a href="/dashboard/">Overview</a>
                <a href="/dashboard/jobs">Jobs</a>
                <a href="/dashboard/runs">Discovery Runs</a>
                <a href="/docs" target="_blank">API Docs</a>
            </div>
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
