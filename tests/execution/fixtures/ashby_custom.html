<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Platform Engineer - Gamma (Ashby-like, custom widgets)</title></head>
<body>
<div class="ashby-application-form">
  <form novalidate>
    <div class="ashby-application-form-field-entry"><span class="label">Location *</span><div role="combobox" aria-expanded="false" tabindex="0" data-widget="location-picker">Select a location</div></div>
    <div class="ashby-application-form-field-entry"><span class="label">Resume *</span><div data-widget="file-drop" role="button" tabindex="0">Drop your resume here</div></div>
    <div class="ashby-application-form-field-entry"><span class="label">Pronouns</span><div role="listbox" tabindex="0">She/Her</div></div>
    <button type="submit">Submit Application</button>
  </form>
</div>
</body>
</html>
