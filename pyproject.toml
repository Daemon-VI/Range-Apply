[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "0.5.0"
description = "CareerOS / Range Apply — high-volume, truthful, evidence-backed job application engine"
readme = "README.md"
# 3.11 is what CI, the venv and every free host we target actually run.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    # Required by app/career/dashboard/views.py -> fastapi.Form(...).
    # Without it `from app.main import app` raises RuntimeError at import time.
    "python-multipart>=0.0.9",
    # Alembic is the authoritative schema mechanism (see docs/DEVELOPMENT.md).
    # It is a runtime dependency, not a dev convenience: the app refuses to
    # create its own schema and requires `alembic upgrade head`.
    "alembic>=1.13.0",
    # IANA zone database for the scheduler's per-tenant day/week cap boundaries;
    # Windows ships none, so zoneinfo needs this pure-Python package there.
    "tzdata>=2024.1",
    # Blueprint Phase 8: local, deterministic document rendering of validated
    # preparations (no AI, no cloud). fpdf2 -> PDF, python-docx -> DOCX,
    # pypdf -> structural validation / text extraction.
    "fpdf2>=2.7.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
# Desktop control center shell (python -m app.desktop): pywebview over the
# platform webview (WebView2 on Windows). The server and dashboards run
# without it.
desktop = [
    "pywebview>=6.2",
    # Increment 5: native Windows toasts for local notifications. Windows-only
    # (it imports `winreg`), and entirely optional — without it the in-app
    # notification center is the only surface.
    "winotify>=1.1; sys_platform == 'win32'",
]
firecrawl = [
    "firecrawl-py>=4.0.0",
]
llm = [
    "google-genai>=1.0.0",
]
# Optional CPU-only semantic matching (Phase 3). Deliberately NOT a default
# dependency: the deterministic matcher must work with zero extra installs.
semantic = [
    "sentence-transformers>=3.0.0",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]
# Playwright is free/open-source; this extra is only needed for a REAL
# (non-dry-run) application submission - the app imports and runs fine
# without it installed.
browser = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "perf: larger synthetic-volume fixtures; the 5,000-job run needs CAREEROS_PERF=1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501: the pre-existing codebase has ~140 long lines, mostly docstrings and
# SQLAlchemy column definitions. Wrapping them is churn with no behavioural
# value; new code should stay under 100 columns anyway.
ignore = ["E501"]
