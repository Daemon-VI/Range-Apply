[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "0.2.0"
description = "CareerOS — Autonomous Career Operating System (Phase 2: Job Discovery)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    # Required by app/career/dashboard/views.py -> fastapi.Form(...).
    # Without it `from app.main import app` raises RuntimeError at import time.
    "python-multipart>=0.0.9",
    # Alembic is the authoritative schema mechanism (see docs/DEVELOPMENT.md).
    # It is a runtime dependency, not a dev convenience: the app refuses to
    # create its own schema and requires `alembic upgrade head`.
    "alembic>=1.13.0",
]

[project.optional-dependencies]
firecrawl = [
    "firecrawl-py>=4.0.0",
]
llm = [
    "google-genai>=1.0.0",
]
# Optional CPU-only semantic matching (Phase 3). Deliberately NOT a default
# dependency: the deterministic matcher must work with zero extra installs.
semantic = [
    "sentence-transformers>=3.0.0",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]
# Playwright is free/open-source; this extra is only needed for a REAL
# (non-dry-run) application submission - the app imports and runs fine
# without it installed.
browser = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
